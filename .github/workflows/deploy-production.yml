name: Deploy Frontend

on:
  push:
    branches:
      - staging
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Choose environment'
        required: true
        default: 'staging'
        type: choice
        options:
        - staging
        - production

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# ONE group for every frontend deploy, because there is only one host.
#
# `staging` and `production` differ by DEPLOY_PATH and NGINX_CONF alone — both rsync to
# `secrets.SSH_HOST` and both end in `nginx -t && systemctl reload nginx` on that same box.
# The matrix already serialises the two environments WITHIN a run (`max-parallel: 1`), but
# nothing serialised two RUNS, so a merge landing while an earlier deploy was still running
# could reload nginx underneath it. Grouping by ref would not fix it either: a push to
# `main` deploys staging as well, so it collides with a `staging`-branch push.
#
# `cancel-in-progress: false` deliberately, matching the backend: killing a deploy midway
# through an rsync leaves a half-written document root, which is worse than waiting. The
# cost is that a stuck run blocks the queue behind it — the backend hit exactly that on
# 2026-08-26 when a GitHub incident left a deploy `queued` with no jobs for an hour. The
# remedy is to cancel that run, not to make deploys interruptible.
concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  plan:
    name: Resolve deploy targets
    runs-on: ubuntu-latest
    outputs:
      envs: ${{ steps.pick.outputs.envs }}
    steps:
      - name: Pick environments for this trigger
        id: pick
        run: |
          # `main` IS production, and staging.odly.ai is meant to MIRROR it — the same
          # code, pointed at the staging backend. So a push to main deploys BOTH sites
          # from that one commit.
          #
          # Why: previously only the pushed branch deployed, so every merge to main left
          # staging.odly.ai serving OLDER code than production. It drifted twice inside a
          # single day (2026-08-18/19); once a smoke test ran against a build that
          # predated the feature under test. Building both from the same commit removes
          # the drift by construction, instead of relying on someone remembering to
          # re-sync the branch afterwards.
          #
          # Pushing the `staging` BRANCH still deploys staging only, so a throwaway branch
          # can still be tried out on staging.odly.ai.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo 'envs=["${{ github.event.inputs.environment }}"]' >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo 'envs=["production","staging"]' >> "$GITHUB_OUTPUT"
          else
            echo 'envs=["staging"]' >> "$GITHUB_OUTPUT"
          fi

  deploy-frontend:
    name: Deploy Frontend (${{ matrix.environment }})
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      # Production first, one at a time: prod must not queue behind staging, and two
      # concurrent `nginx -t && systemctl reload nginx` against the same host would race.
      max-parallel: 1
      fail-fast: false
      matrix:
        environment: ${{ fromJson(needs.plan.outputs.envs) }}
    environment: ${{ matrix.environment }}

    steps:
      - name: Set Environment Variables
        id: env
        run: |
          if [ "${{ matrix.environment }}" = "staging" ]; then
            echo "VITE_API_URL=https://staging.odly.ai" >> $GITHUB_OUTPUT
            echo "VITE_APP_URL=https://staging.odly.ai" >> $GITHUB_OUTPUT
            echo "DEPLOY_PATH=/var/www/frontend-staging" >> $GITHUB_OUTPUT
            echo "NGINX_CONF=staging.odly.ai" >> $GITHUB_OUTPUT
            echo "ENV_LABEL=STAGING" >> $GITHUB_OUTPUT
            # Alliance console ON for staging — activate for non-global alliance_admins
            # (verification env). Prod stays OFF until end-to-end sign-off. See AllianceConsoleRoute.
            echo "VITE_ALLIANCE_CONSOLE=true" >> $GITHUB_OUTPUT
          else
            echo "VITE_API_URL=https://app.odly.ai" >> $GITHUB_OUTPUT
            echo "VITE_APP_URL=https://odly.ai" >> $GITHUB_OUTPUT
            echo "DEPLOY_PATH=/var/www/frontend" >> $GITHUB_OUTPUT
            echo "NGINX_CONF=app.odly.ai" >> $GITHUB_OUTPUT
            echo "ENV_LABEL=PRODUCTION" >> $GITHUB_OUTPUT
            # Alliance console GO-LIVE: on in production for non-global alliance_admins.
            echo "VITE_ALLIANCE_CONSOLE=true" >> $GITHUB_OUTPUT
          fi

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        # `npm ci` — installs exactly what package-lock.json pins. The previous
        # `rm -f package-lock.json && npm install` threw the lockfile away and re-resolved
        # every range on each deploy, which meant (a) builds were not reproducible — the
        # same commit produced different chunk hashes — and (b) the versions we audit in
        # the lockfile were NOT the versions we shipped. Transitive-only packages
        # (brace-expansion, linkify-it, socket.io-parser) have no entry in package.json,
        # so nothing in the repo pinned them at build time.
        run: npm ci

      - name: Build frontend
        env:
          VITE_API_URL: ${{ steps.env.outputs.VITE_API_URL }}
          VITE_APP_URL: ${{ steps.env.outputs.VITE_APP_URL }}
          # Per-environment alliance-console gate (staging=true, production=false).
          VITE_ALLIANCE_CONSOLE: ${{ steps.env.outputs.VITE_ALLIANCE_CONSOLE }}
          # Inline version info — surfaced in Layout sidebar footer next to FE version.
          VITE_GIT_SHA: ${{ github.sha }}
        run: npm run build

      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: "placeholder"

      - name: Add Known Hosts
        run: |
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy Frontend
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          DEPLOY_PATH: ${{ steps.env.outputs.DEPLOY_PATH }}
        run: |
          ssh ${SSH_USER}@${SSH_HOST} << ENDSSH
            set -e

            echo "🚀 Starting frontend deployment..."
            DEPLOY_PATH="${DEPLOY_PATH}"

            # Create frontend directory if it doesn't exist
            mkdir -p \$DEPLOY_PATH

            # Install nginx if not installed
            if ! command -v nginx &> /dev/null; then
              echo "📦 Installing nginx..."
              apt-get update
              apt-get install -y nginx
            fi

            echo "✅ Frontend directory ready: \$DEPLOY_PATH"
          ENDSSH

      - name: Copy built files
        env:
          DEPLOY_PATH: ${{ steps.env.outputs.DEPLOY_PATH }}
        run: |
          rsync -avz --delete \
            ./dist/ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${DEPLOY_PATH}/

          # Fix permissions after rsync
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "chown -R www-data:www-data ${DEPLOY_PATH}"

      # Note: Nginx configuration for app.odly.ai is managed manually on the server
      # Do not regenerate configs here to avoid conflicts with landing page (odly.ai)

      - name: Reload Nginx
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          ssh ${SSH_USER}@${SSH_HOST} << 'ENDSSH'
            set -e
            echo "🔄 Reloading nginx..."
            nginx -t && systemctl reload nginx
            echo "✅ Nginx reloaded"
          ENDSSH

      - name: Verify Deployment
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          APP_URL: ${{ steps.env.outputs.VITE_APP_URL }}
        run: |
          echo "🏥 Running health check..."
          sleep 3

          # Check if frontend is accessible
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" ${APP_URL}/ || echo "000")

          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Frontend health check passed!"
          else
            echo "⚠️  Frontend returned code: $HTTP_CODE"
            echo "This might be expected if nginx needs more time to start"
          fi

      - name: Deployment Summary
        if: always()
        env:
          ENV_NAME: ${{ steps.env.outputs.ENV_LABEL }}
          APP_URL: ${{ steps.env.outputs.VITE_APP_URL }}
          API_URL: ${{ steps.env.outputs.VITE_API_URL }}
        run: |
          echo "## Frontend Deployment Summary 📋 - ${ENV_NAME}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: ${ENV_NAME}" >> $GITHUB_STEP_SUMMARY
          echo "- **Server IP**: ${{ secrets.SSH_HOST }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### URLs" >> $GITHUB_STEP_SUMMARY
          echo "- 🌐 Frontend: ${APP_URL}" >> $GITHUB_STEP_SUMMARY
          echo "- 📚 API: ${API_URL}" >> $GITHUB_STEP_SUMMARY
          echo "- 🏥 Backend Health: ${API_URL}/health" >> $GITHUB_STEP_SUMMARY
