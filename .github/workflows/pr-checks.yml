name: PR Checks (type-check + lint + tests)

# Runs type-check, lint and the vitest suite on PRs. Type-check is the guard for the generated
# API-contract types (src/types/generated/api.ts, produced by `npm run gen:types`
# from ../BE-service/openapi.json): if a service/component consumes a field the
# contract does not provide, this fails.
#
# NOTE: this cannot REGENERATE the types in CI — `gen:types` reads the sibling
# BE-service repo's openapi.json, which isn't checked out here. When a backend
# contract changes, regenerate locally (`npm run gen:types`) and commit the updated
# generated file alongside; the BE repo's jest-checks workflow guards openapi.json
# freshness on its side.
#
# The vitest step runs in the SAME job as type-check/lint on purpose: it reuses that
# job's `npm ci` and runner, so the marginal cost is only the suite's own runtime
# (~4s) rather than a second checkout+install. Until then nothing ran the suite in
# CI at all, and it silently went red for six days when a button's copy was renamed
# ("Process as KB" -> "Add to KB", #124) — type-check and lint cannot see a changed
# string. NOTE: neither `staging` nor `main` is a protected branch, so this reports
# failures but does not BLOCK a merge; making it blocking needs branch protection
# with "type-check + lint + tests" as a required status check.
#
# F6 (owner 2026-11-06): a PR into `staging` runs only the tests its change can reach
# (scripts/ci/select-tests.mjs: the import graph + changed tests + .ci/smoke-tests.txt + every
# test that reads files from disk; a change in .ci/full-run-triggers.txt, a deleted/renamed file
# or any doubt runs everything). The FULL suite runs on every push to `staging` (owner 2026-11-06: no nightly — it re-tested an unchanged branch), on any
# PR into `main`, on a manual run, and before every production deploy (deploy-production.yml).

on:
  push:
    branches: [staging]
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - "eslint.config.js"
      - "vitest.config.ts"
      - "vite.config*.ts"
      - "tailwind.config.*"
      - "postcss.config.*"
      - "index.html"
      - "public/**"
      - "scripts/ci/**"
      - "scripts/eslint/**"
      - ".ci/**"
      - ".github/workflows/pr-checks.yml"
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - "eslint.config.js"
      - "vitest.config.ts"
      - "vite.config*.ts"
      - "tailwind.config.*"
      - "postcss.config.*"
      - "index.html"
      - "public/**"
      - "scripts/ci/**"
      - "scripts/eslint/**"
      - ".ci/**"
      - ".github/workflows/pr-checks.yml"

concurrency:
  # head_ref is empty outside PRs; a newer staging push cancels an older one's run.
  group: fe-pr-checks-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: type-check + lint + tests
    runs-on: ubuntu-latest
    # The job ran 9m19s–9m56s on 2026-10-16 and #619 was cancelled 12 s over a 10-minute limit
    # with every test green. On 2026-11-07 the same suite took 478 s on one staging push and 746 s
    # on the next (runner speed varies ~55%), and the second was cancelled 2 s after all 985 files
    # passed at the 15-minute limit. 25 covers a slow runner; a passing run costs the same.
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # A PR checks out GitHub's merge commit; its first parent is the base tip, so depth 2 is
          # enough for the selector to diff exactly what the PR adds (HEAD^1...HEAD).
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      # Module-boundary and import-cycle ratchets (scripts/ci/check-*.mjs): fail when an area pair,
      # an upward import or a cycle group grows past .ci/baselines/, printing file:line of each
      # offending import. A drop passes; lock it in with `npm run check:boundaries -- --update`.
      - name: Import boundaries
        run: npm run check:boundaries

      - name: Import cycles
        run: npm run check:cycles

      # No feature index may load with the app shell (scripts/ci/check-shell-bundle.mjs): it would
      # put the whole feature into the main bundle every page downloads first.
      - name: Shell bundle
        run: npm run check:shell

      # Production build + bundle guard (scripts/ci/check-bundle.mjs, owner 2026-11-08): the main
      # chunk stays within .ci/baselines/bundle.json, and pages keep their lazy chunks lazy.
      - name: Bundle budget
        run: npx vite build --logLevel warn && npm run check:bundle

      # Only on a PR into `staging`: every other event (and a PR into `main`, the release path)
      # leaves `mode` unset and runs the full suite below. The script never fails the job; on any
      # error it selects everything.
      - name: Select tests
        id: select
        if: github.event_name == 'pull_request' && github.base_ref == 'staging'
        run: node scripts/ci/select-tests.mjs --base HEAD^1 --out "$RUNNER_TEMP/selected-tests.txt"

      - name: Test (affected)
        if: steps.select.outputs.mode == 'affected'
        run: xargs npx vitest run < "$RUNNER_TEMP/selected-tests.txt"

      - name: Test (full suite)
        if: steps.select.outputs.mode != 'affected'
        run: npm test
